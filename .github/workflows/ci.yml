name: CI Quality Gate — Backend, Docker & DevSecOps

on:
  push:
    branches: [ develop, staging, main, Nyaga-*, update-* ]
  pull_request:
    branches: [ develop, staging, main ]
  workflow_dispatch:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. STATUTORY MATH & DATABASE HEALTH TESTS
  # ============================================================================
  pytest-statutory-verification:
    name: ⚖️ Python 3.11 / Statutory Math & API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pytest Suite (18 Tests: Statutory Math, Security, Health)
        run: |
          PYTHONPATH=. pytest app/tests -v --durations=10

  # ============================================================================
  # 2. DOCKER BUILD & CONTAINER HEALTH PROBE
  # ============================================================================
  docker-smoke-test:
    name: 🐳 Docker Multi-Stage Build & Container Health Probe
    needs: pytest-statutory-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: nyaga-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Health & Endpoints
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e PORT=8000 \
            -e APP_ENV=test \
            -e JWT_SECRET_KEY=smoke-test-secret-key-32-chars-long-1234567 \
            nyaga-backend:test
          
          # Poll health endpoint up to 25 seconds
          for i in {1..25}; do
            if curl -s http://localhost:8000/api/v1/health | grep -q "healthy"; then
              echo "✓ Backend container is healthy and responding!"
              break
            fi
            sleep 1
          done

          # Verify statutory remuneration schedules API
          curl -f http://localhost:8000/api/v1/remuneration/schedules
          docker stop test-api

  # ============================================================================
  # 3. DEVSECOPS: AQUA SECURITY TRIVY VULNERABILITY SCANNER
  # ============================================================================
  devsecops-trivy-scan:
    name: 🛡️ DevSecOps / Trivy Container Vulnerability Scan
    needs: docker-smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image for Security Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: nyaga-backend:security-scan
          cache-from: type=gha

      - name: Run Aqua Security Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nyaga-backend:security-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Security Audit Summary
        run: |
          echo "### 🛡️ Aqua Security Trivy Container Scan" >> $GITHUB_STEP_SUMMARY
          echo "✓ Container base: python:3.11-slim (Hardened, non-root user appuser:10001)" >> $GITHUB_STEP_SUMMARY
          echo "✓ Zero build tools in runtime image" >> $GITHUB_STEP_SUMMARY
