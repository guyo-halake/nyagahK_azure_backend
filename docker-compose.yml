services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyaga-law-backend-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENV=development
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:8080,https://kithinjiandco.vercel.app,https://karanitest.vercel.app
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-nyaga-law-advocates-jwt-secret-key-32chars}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

networks:
  default:
    name: nyaga-backend-network
